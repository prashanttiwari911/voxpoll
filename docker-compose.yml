version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SENTIMENT_SERVICE_URL=http://sentiment-service:8000
    depends_on:
      - sentiment-service
    networks:
      - voti-network

  sentiment-service:
    build:
      context: ./sentiment-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - voti-network

networks:
  voti-network:
    driver: bridge
